<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 속도 — 게임 화면 (컬러 목업)</title>
<style>
  :root {
    --bg-base:#17100f; --bg-game:#2b1a17;
    --banner-idle:#241a17; --banner-loud:#3a2a22; --banner-company:#2b1a17;
    --ink-primary:#f3e6d8; --ink-soft:#b89a86; --ink-faint:#7a6256;
    --accent-stable:#ffb257; --accent-unstable:#7e8a99;
    --gauge-track:#3a2a22; --gauge-fill:#ff9614;
    --fig-player:#ffb257; --fig-other:#6b5a4e;
  }
  @font-face {
    font-family:'DungGeunMo';
    src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/DungGeunMo.woff') format('woff');
    font-weight:normal; font-display:swap;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DungGeunMo','Apple SD Gothic Neo','Malgun Gothic',monospace;
    background:var(--bg-base); color:var(--ink-primary); padding:20px; image-rendering:pixelated; }
  h1 { font-size:18px; color:var(--accent-stable); margin-bottom:4px; }
  .lead { font-size:11px; color:var(--ink-soft); margin-bottom:16px; line-height:1.6; }

  .stage-wrap { max-width:1000px; margin:0 auto; }

  /* ===== 3-panel shell — 픽셀 프레임 ===== */
  .shell { display:grid; grid-template-columns:160px 1fr 160px; height:520px;
    border-radius:0; overflow:hidden; background:var(--bg-base);
    border:4px solid #0a0706;
    box-shadow:
      inset 0 0 0 2px #3a2a22,
      inset 0 0 0 4px #0a0706,
      0 0 0 2px #2b1a17,
      8px 8px 0 0 rgba(0,0,0,.5); }
  @media (max-width:780px){ .shell{grid-template-columns:0 1fr 0;} .banner{display:none!important;} }

  .banner { display:flex; flex-direction:column; align-items:center; justify-content:space-around;
    padding:16px 10px; background:var(--banner-idle); transition:background .5s; }
  .banner.loud { background:var(--banner-loud); }
  .banner.company { background:var(--banner-company); }
  .ad { width:100%; aspect-ratio:4/3; border:2px solid #ffffff1a; border-radius:0;
    display:flex; align-items:center; justify-content:center; font-size:9px; color:#ffffff55;
    text-align:center; transition:all .5s; box-shadow:inset 1px 1px 0 #ffffff0d; }
  .banner.company .ad { color:var(--accent-stable); border-color:#ffb25744; }
  .banner.loud .ad { color:#ffffff88; border-color:#ff961433; }

  /* ===== game viewport — 스캔라인 + 비네팅 오버레이 ===== */
  .game { position:relative; overflow:hidden; height:520px; }
  .game::after {
    content:''; position:absolute; inset:0; z-index:20; pointer-events:none;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.35) 100%);
    mix-blend-mode:multiply;
  }
  .layer { position:absolute; left:0; right:0; }
  .sky { top:0; bottom:0; transition:background .6s; }

  .ground { position:absolute; bottom:90px; left:0; right:0; height:2px; z-index:5;
    background-image:repeating-linear-gradient(90deg,#5e4438 0 12px,transparent 12px 24px);
    animation:scroll 1.1s linear infinite; }
  @keyframes scroll { to { background-position:-24px 0; } }

  .runner { position:absolute; left:48%; bottom:92px; transform:translateX(-50%); width:5px; height:5px; z-index:8; }
  .runner i { position:absolute; width:5px; height:5px; }
  .other { position:absolute; left:60%; bottom:92px; width:5px; height:5px; z-index:7; opacity:0; transition:opacity .6s; }
  .other i { position:absolute; width:5px; height:5px; }

  .title-text { position:absolute; top:90px; left:0; right:0; text-align:center;
    font-size:42px; letter-spacing:3px; color:var(--ink-primary); z-index:9;
    text-shadow:3px 3px 0 #b3611a, 5px 5px 0 #0a0706; }

  /* ===== speech bubble (typewriter) — 고전 게임 이중 픽셀 테두리 ===== */
  .bubble-layer { position:absolute; left:0; right:0; display:flex; justify-content:center; z-index:10; padding:0 30px; }
  .bubble-layer.stacked { flex-direction:column; align-items:center; gap:14px; }
  .bubble { position:relative; display:inline-block; max-width:560px;
    background:#140d0a; border-radius:0;
    /* 이중 픽셀 테두리: 바깥 굵은 stable + 안쪽 어두운 선, 모두 각짐 */
    border:3px solid var(--accent-stable);
    box-shadow:
      inset 0 0 0 3px #140d0a,
      inset 0 0 0 5px #3a2a22,
      /* 픽셀 베벨: blur 0 계단식 그림자 */
      6px 6px 0 0 rgba(0,0,0,.55);
    padding:18px 26px; font-size:17px; color:var(--ink-primary); line-height:1.7;
    text-align:center; min-height:30px; }
  /* 각진 픽셀 꼬리 (계단형) */
  .bubble::before { content:''; position:absolute; left:34px; bottom:-12px; width:18px; height:6px; background:var(--accent-stable); }
  .bubble::after { content:''; position:absolute; left:40px; bottom:-18px; width:6px; height:6px; background:var(--accent-stable);
    box-shadow:-6px -6px 0 0 var(--accent-stable); }
  .bubble-layer.stacked .bubble { max-width:520px; padding:12px 22px; font-size:13px; line-height:1.55; }
  .bubble-layer.stacked .bubble::before,
  .bubble-layer.stacked .bubble::after { display:none; }
  .cursor { color:var(--accent-stable); animation:blink .5s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }

  /* ===== gauge — 각진 픽셀 ===== */
  .gauge-wrap { position:absolute; bottom:28px; left:50%; transform:translateX(-50%); width:55%; z-index:9; text-align:center; }
  .gauge-label { font-size:11px; color:var(--ink-soft); margin-bottom:6px; text-shadow:1px 1px 0 rgba(0,0,0,.7); }
  .gauge-track { width:100%; height:14px; background:var(--gauge-track); border:2px solid #140d0a; border-radius:0;
    box-shadow:inset 0 0 0 1px #000, 2px 2px 0 0 rgba(0,0,0,.5); overflow:hidden; }
  .gauge-fill { height:100%; width:0; background:var(--gauge-fill); border-radius:0; transition:width .5s;
    box-shadow:inset 0 -3px 0 0 #d97a08, inset 0 2px 0 0 #ffd9a0; }

  /* ===== buttons — 각진 픽셀 베벨 ===== */
  .btn-row { position:absolute; bottom:40px; left:0; right:0; display:flex; gap:16px; justify-content:center; z-index:9; }
  .btn { font-family:inherit; font-size:15px; cursor:pointer; padding:13px 28px; border-radius:0;
    transition:transform .08s; position:relative; }
  .btn:active { transform:translate(3px,3px); }
  .btn:active::after { box-shadow:none; }
  .btn-primary { background:var(--accent-stable); color:var(--bg-base);
    border:3px solid #140d0a; box-shadow:4px 4px 0 0 #000, inset 0 0 0 2px #ffd9a0; }
  .btn-ghost { background:#241a17; color:var(--accent-stable);
    border:3px solid var(--accent-stable); box-shadow:4px 4px 0 0 #000, inset 0 0 0 2px #3a2a22; }

  /* decor */
  .cloud { position:absolute; background:rgba(243,230,216,.6); border-radius:14px; }
  .star { position:absolute; width:2px; height:2px; background:#f3e6d8; border-radius:50%; }
  .building { position:absolute; bottom:90px; }
  .tree-t { position:absolute; bottom:90px; background:#1a2420; }
  .tree-c { position:absolute; background:#1f2e26; border-radius:50% 50% 45% 45%; }
  .moon { position:absolute; border-radius:50%; background:#f3e6d8; }
  .postcard { position:absolute; top:120px; left:50%; transform:translateX(-50%);
    width:380px; height:210px; background:#241a2a; border:2px solid var(--accent-stable); border-radius:6px; z-index:6; overflow:hidden; }

  /* ===== nav ===== */
  .nav { max-width:1000px; margin:16px auto 0; display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  .nav button { font-family:inherit; font-size:10px; padding:8px 12px; cursor:pointer;
    background:var(--banner-idle); color:var(--ink-soft); border:1px solid var(--banner-loud); border-radius:4px; transition:all .2s; }
  .nav button:hover { border-color:var(--accent-stable); color:var(--accent-stable); }
  .nav button.active { background:var(--accent-stable); color:var(--bg-base); border-color:var(--accent-stable); }
  .screen-note { max-width:1000px; margin:10px auto 0; text-align:center; font-size:10px; color:var(--ink-faint); line-height:1.6; }
</style>
</head>
<body>
  <h1>나의 속도 — 게임 화면 (컬러 목업)</h1>
  <p class="lead">화면을 넘기면 말풍선이 <b style="color:var(--accent-stable)">한 글자씩 타이핑</b>됩니다 (고전 게임풍). A안 팔레트 · 풀세트 러너 · 5단계 배경 적용.</p>

  <div class="stage-wrap">
    <div class="shell">
      <div class="banner" id="bannerL"><div class="ad">광고</div><div class="ad">광고</div></div>
      <div class="game" id="game">
        <div class="layer sky" id="sky"></div>
        <div id="decor"></div>
        <div class="ground" id="ground"></div>
        <div class="other" id="other"><i></i></div>
        <div class="runner" id="runner"><i></i></div>
        <div class="title-text" id="titleText" style="display:none">나 의  속 도</div>
        <div class="bubble-layer" id="bubbleLayer" style="top:280px">
          <div class="bubble" id="bubble"><span id="typed"></span><span class="cursor">▌</span></div>
        </div>
        <div class="gauge-wrap" id="gaugeWrap" style="display:none">
          <div class="gauge-label" id="gaugeLabel">머무는 중…</div>
          <div class="gauge-track"><div class="gauge-fill" id="gaugeFill"></div></div>
        </div>
        <div class="btn-row" id="btnRow" style="display:none"></div>
      </div>
      <div class="banner" id="bannerR"><div class="ad">광고</div><div class="ad">광고</div></div>
    </div>

    <div class="nav" id="nav"></div>
    <p class="screen-note" id="screenNote"></p>
  </div>

<script>
  const U=5;
  const RUN=[[[3,0],[2,1],[2,2],[1,3],[3,4]],[[3,0],[2,1],[2,2],[2,3],[2,4]],[[3,0],[2,1],[2,2],[3,3],[1,4]],[[3,0],[2,1],[2,2],[2,3],[2,4]]];
  const sh=(px,c)=>px.map(([x,y])=>`${x*U}px ${y*U}px 0 ${c}`).join(',');
  const $=id=>document.getElementById(id);

  // ===== journey start 문단 (순차 타이핑) =====
  const JOURNEY_PARAGRAPHS=[
    '이제부터는 진짜 여정이에요.',
    '빠르게 가면 먼저 도착할 수 있지만,\n그만큼 쉽게 지칠 수도 있어요.',
    '천천히 가는 것도 괜찮아요.\n다만 멈추지 않고,\n나에게 맞는 리듬을 잃지 않는 게 중요해요.',
    '이 길의 정답은 하나가 아니에요.\n중요한 건 내 속도로 나아가는 것.',
  ];

  // ===== screen definitions =====
  const SCREENS=[
    { id:'Title', scene:'road', banner:'idle', title:true,
      text:'달려도, 걸어도 괜찮아요.\n당신만의 속도를 찾아볼게요.', bubbleTop:300,
      buttons:[['내 속도 찾아보기','primary']], note:'시작 화면 · 버튼이 오디오 언락 겸함' },
    { id:'Tutorial', scene:'road', banner:'idle',
      text:'조금 빨라져볼까요?\nSpacebar 키를 눌러보세요.', bubbleTop:300,
      note:'조작 감각 학습 · 정답 속도 유도 없음' },
    { id:'Find Pace', scene:'road', banner:'idle',
      text:'이제 가장 편안한 속도로 걸어보세요.\n오래 머물 수 있는 리듬이면 충분해요.', bubbleTop:270,
      gauge:{label:'머무는 중…', pct:0.6}, note:'안착 게이지 · 본인이 직접 속도 확정' },
    { id:'Journey Start', scene:'journeyStart', banner:'idle',
      paragraphs:JOURNEY_PARAGRAPHS,                 // text/texts 대신 — 순차 타이핑
      bubbleTop:300, autoTransition:true,
      note:'본게임 진입 전환 · 문단 순차 타이핑 → 슬라이드 전환' },
    { id:'Main Play', scene:'cityDay', banner:'idle',
      text:'내 속도대로..', bubbleTop:100,
      gauge:{label:'안정 게이지', pct:0.18}, note:'평온 구간 · 일정 시간 후 다른 존재 등장' },
    { id:'Encounter', scene:'cityNight', banner:'loud', other:true,
      text:'바깥의 속도가 스쳐 갑니다.', bubbleTop:100,
      gauge:{label:'리듬이 이어지는 중…', pct:0.4}, note:'다른 존재 등장 · 적 아님 · 따라가면 흔들림' },
    { id:'Return', scene:'highway', banner:'idle',
      text:'이제 조금 알 것 같아요.\n당신의 리듬은 사라지지 않았어요.', bubbleTop:270,
      note:'1·2·3회차: 혼란 → 인식 → 체화' },
    { id:'Clear', scene:'space', banner:'company',
      text:'당신의 속도를 찾았습니다.', bubbleTop:210, runnerHigh:true,
      sub:'이곳에는 피니시가 없습니다.\n계속 달려도 되고, 여기서 멈춰도 괜찮아요.',
      note:'인정의 순간 · 양옆 배너 → 지원회사 (이스터에그)' },
    { id:'Ending', scene:'space', banner:'idle', postcard:true,
      text:'당신의 풍경이 도착했어요.', bubbleTop:70, runnerMid:true,
      buttons:[['내 풍경 저장하기','primary'],['다시 걸어보기','ghost']],
      note:'풍경 = canvas 캡처 · 순위/기록 없음' },
  ];

  // ===== scene builder =====
  function buildScene(scene){
    const sky=$('sky'), decor=$('decor'), ground=$('ground');
    decor.innerHTML=''; ground.style.display='block';
    const W=()=>$('game').clientWidth;

    if(scene==='road'){
      sky.style.background='linear-gradient(180deg,#6f9bc4 0%,#9cc0dd 55%,#c9ddd0 100%)';
      [[60,70,90,22],[280,120,120,26],[480,60,70,18]].forEach(([x,y,w,h])=>{
        const c=document.createElement('div'); c.className='cloud';
        c.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px;opacity:.7`; decor.appendChild(c); });
      const g=document.createElement('div'); g.style.cssText='position:absolute;bottom:0;left:0;right:0;height:90px;background:#3a3026;z-index:4'; decor.appendChild(g);
    }
    else if(scene==='cityDay' || scene==='cityNight'){
      const night=scene==='cityNight';
      sky.style.background=night?'linear-gradient(180deg,#140f22 0%,#3a2238 100%)':'linear-gradient(180deg,#7fa8c8 0%,#e0b890 100%)';
      if(night){ const m=document.createElement('div'); m.className='moon'; m.style.cssText='right:18%;top:40px;width:34px;height:34px'; decor.appendChild(m);
        for(let i=0;i<24;i++){ const s=document.createElement('div'); s.className='star'; s.style.cssText=`left:${5+Math.random()*90}%;top:${Math.random()*45}%;opacity:.8`; decor.appendChild(s);} }
      for(let i=0;i<9;i++){ const b=document.createElement('div'); b.className='building';
        const w=40+(i*37)%50,h=100+(i*53)%150; b.style.cssText=`left:${i*11.5}%;width:${w}px;height:${h}px;background:${night?'#000':'#4a4658'};z-index:3`; decor.appendChild(b);}
      const g=document.createElement('div'); g.style.cssText=`position:absolute;bottom:0;left:0;right:0;height:90px;background:${night?'#160f14':'#2a1d18'};z-index:4`; decor.appendChild(g);
    }
    else if(scene==='highway'){
      sky.style.background='linear-gradient(180deg,#16121f 0%,#241a2a 100%)';
      for(let i=0;i<22;i++){ const s=document.createElement('div'); s.className='star'; s.style.cssText=`left:${5+Math.random()*90}%;top:${Math.random()*40}%;opacity:.7`; decor.appendChild(s);}
      for(let i=0;i<14;i++){ const b=document.createElement('div'); b.className='building'; const h=20+(i*29)%40;
        b.style.cssText=`left:${i*7.3}%;width:26px;height:${h}px;background:#241c2e;bottom:120px;z-index:2`; decor.appendChild(b);}
      for(let i=0;i<7;i++){ const x=20+i*14, th=36+(i*31)%28;
        const t=document.createElement('div'); t.className='tree-t'; t.style.cssText=`left:${x}%;width:8px;height:${th}px;z-index:3`; decor.appendChild(t);
        const c=document.createElement('div'); c.className='tree-c'; c.style.cssText=`left:calc(${x}% - 11px);bottom:${90+th-6}px;width:30px;height:30px;z-index:3`; decor.appendChild(c);}
      const g=document.createElement('div'); g.style.cssText='position:absolute;bottom:0;left:0;right:0;height:90px;background:#161018;z-index:4'; decor.appendChild(g);
    }
    else if(scene==='space'){
      sky.style.background='radial-gradient(ellipse at 50% 120%,#2b1a3a 0%,#14101e 60%,#0d0a14 100%)';
      ground.style.display='none';
      for(let i=0;i<70;i++){ const s=document.createElement('div'); s.className='star';
        s.style.cssText=`left:${2+Math.random()*96}%;top:${2+Math.random()*96}%;opacity:${.4+Math.random()*.5}`; decor.appendChild(s);}
    }
    else if(scene==='journeyStart'){
      // road와 이어지되 노란기 도는 이른 아침 — 길이 도시로 열리는 느낌
      sky.style.background='linear-gradient(180deg,#f0c97a 0%,#f5dfa0 40%,#e8c88a 100%)';
      // 구름 3개 — road 패턴, 더 낮고(top↑) 더 선명하게(opacity↑)
      [[60,95,90,22],[280,150,120,26],[480,85,70,18]].forEach(([x,y,w,h])=>{
        const c=document.createElement('div'); c.className='cloud';
        c.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px;opacity:.9`; decor.appendChild(c); });
      // 원경 언덕 실루엣 2겹 — 각짐(clip-path) 유지, 수평선 강조
      const hillFar=document.createElement('div');
      hillFar.style.cssText='position:absolute;left:0;right:0;bottom:90px;height:70px;background:#e3b878;z-index:2;border-radius:0;clip-path:polygon(0 100%,0 55%,18% 35%,40% 60%,62% 25%,82% 55%,100% 30%,100% 100%)'; decor.appendChild(hillFar);
      const hillNear=document.createElement('div');
      hillNear.style.cssText='position:absolute;left:0;right:0;bottom:90px;height:48px;background:#cf9a55;z-index:3;border-radius:0;clip-path:polygon(0 100%,0 70%,30% 40%,55% 75%,78% 45%,100% 70%,100% 100%)'; decor.appendChild(hillNear);
      // 지면 — road 동일 패턴, 색만 약간 따뜻하게
      const g=document.createElement('div'); g.style.cssText='position:absolute;bottom:0;left:0;right:0;height:90px;background:#4a3826;z-index:4'; decor.appendChild(g);
    }
  }

  // ===== typewriter =====
  let typeTimer=null;
  let typeRun=0;
  function createBubble(){
    const bubble=document.createElement('div');
    bubble.className='bubble';
    bubble.style.whiteSpace='pre-line';
    bubble.innerHTML='<span class="typed"></span><span class="cursor">▌</span>';
    return bubble;
  }
  function typewriteInto(el, text, done, runId){
    clearInterval(typeTimer);
    el.textContent='';
    let i=0;
    typeTimer=setInterval(()=>{
      if(runId!==typeRun){ clearInterval(typeTimer); return; }
      if(i>=text.length){ clearInterval(typeTimer); if(done)done(); return; }
      const ch=text[i]==='\n' ? '\n' : text[i];
      el.textContent+=ch;
      i++;
    }, 55);
  }
  function typewriteMessages(messages, done){
    clearInterval(typeTimer);
    const runId=++typeRun;
    const layer=$('bubbleLayer');
    layer.innerHTML='';
    layer.classList.toggle('stacked', messages.length>1);
    let index=0;
    function writeNext(){
      if(runId!==typeRun) return;
      if(index>=messages.length){ if(done)done(); return; }
      const bubble=createBubble();
      layer.appendChild(bubble);
      typewriteInto(bubble.querySelector('.typed'), messages[index], ()=>{
        index++;
        setTimeout(writeNext, 220);
      }, runId);
    }
    writeNext();
  }

  // 문단 배열을 한 말풍선에 순차 타이핑(교체식). 문단 사이 pauseMs, 마지막 완료 시 done().
  // typewriteInto/createBubble/typeRun 재사용 — show()/abortTransition의 typeRun++로 중단 가능.
  function typewriteSequence(paragraphs, pauseMs, done){
    clearInterval(typeTimer);
    const runId=++typeRun;
    const layer=$('bubbleLayer');
    layer.classList.remove('stacked');     // 단일 말풍선(스택 아님)
    layer.innerHTML='';
    const bubble=createBubble(); layer.appendChild(bubble);
    const typed=bubble.querySelector('.typed');
    let index=0;
    function step(){
      if(runId!==typeRun) return;
      typewriteInto(typed, paragraphs[index], ()=>{
        if(runId!==typeRun) return;
        index++;
        if(index<paragraphs.length){ setTimeout(step, pauseMs); }
        else if(done){ done(); }
      }, runId);
    }
    step();
  }

  // ===== runner anim =====
  let frame=0;
  function loop(){
    frame=(frame+1)%4;
    const ri=document.querySelector('#runner i');
    if(ri) ri.style.boxShadow=sh(RUN[frame],'#ffb257');
    if($('other').style.opacity!=='0'){ const oi=document.querySelector('#other i'); if(oi) oi.style.boxShadow=sh(RUN[(frame+2)%4],'#6b5a4e'); }
    // float in space
    const sc=SCREENS[cur];
    if(sc.runnerHigh){ $('runner').style.bottom=(300+(frame%2?6:0))+'px'; }
    else if(sc.runnerMid){ $('runner').style.bottom=(360+(frame%2?5:0))+'px'; }
    else { $('runner').style.bottom='92px'; }
    setTimeout(loop,150);
  }

  // ===== journey start → main play 슬라이드 전환 (Journey Start 전용) =====
  let transitionTimers=[];
  let transitionOverlay=null;

  // cityDay 씬을 임의 host에 렌더 — buildScene은 고정 #sky/#decor/#ground 대상이라 변경하지 않고,
  // 오버레이 전용으로 cityDay만 인라인 렌더한다(기존 buildScene 동작 무변).
  function buildCityDayInto(host){
    const sky=document.createElement('div');
    sky.style.cssText='position:absolute;inset:0;background:linear-gradient(180deg,#7fa8c8 0%,#e0b890 100%)'; host.appendChild(sky);
    for(let i=0;i<9;i++){ const b=document.createElement('div'); const w=40+(i*37)%50,h=100+(i*53)%150;
      b.style.cssText=`position:absolute;bottom:90px;left:${i*11.5}%;width:${w}px;height:${h}px;background:#4a4658;z-index:3`; host.appendChild(b);}
    const g=document.createElement('div'); g.style.cssText='position:absolute;bottom:0;left:0;right:0;height:90px;background:#2a1d18;z-index:4'; host.appendChild(g);
    const line=document.createElement('div'); line.style.cssText='position:absolute;bottom:90px;left:0;right:0;height:2px;z-index:5;background-image:repeating-linear-gradient(90deg,#5e4438 0 12px,transparent 12px 24px);animation:scroll 1.1s linear infinite'; host.appendChild(line);
  }

  // 진행 중 전환·타이머·시퀀스 전부 정리 (다른 화면으로 이동 시 호출)
  function abortTransition(){
    transitionTimers.forEach(clearTimeout); transitionTimers=[];
    if(transitionOverlay){ transitionOverlay.remove(); transitionOverlay=null; }
    ['sky','decor','ground'].forEach(id=>{ const el=$(id); if(el){ el.style.transition=''; el.style.transform=''; } });
    clearInterval(typeTimer); typeRun++;   // 진행 중 타이핑/시퀀스 무효화
  }

  // 마지막 문단 후: cityDay 오버레이를 오른쪽에서 밀어넣고 현재 씬을 왼쪽으로 동시 슬라이드.
  function slideToMainPlay(){
    $('bubbleLayer').innerHTML='';                              // 말풍선 역할 끝 — 비움
    const ov=document.createElement('div'); ov.id='transitionOverlay';
    // 시작 상태(오른쪽 바깥) + transition 함께 부여. border-radius:0 각짐 유지.
    ov.style.cssText='position:absolute;inset:0;z-index:30;overflow:hidden;border-radius:0;transform:translateX(100%);transition:transform 1100ms ease-in-out';
    buildCityDayInto(ov);
    $('game').appendChild(ov); transitionOverlay=ov;
    const layers=['sky','decor','ground'].map($);
    layers.forEach(el=>{ el.style.transition='transform 1100ms ease-in-out'; });
    // reflow로 시작 상태를 확정한 뒤 목표를 *동기* 적용 → transition 발화.
    // rAF 비의존(프리뷰 hidden 탭은 rAF가 멈춤). 현재 씬과 오버레이가 동시에 슬라이드.
    void ov.offsetWidth;
    ov.style.transform='translateX(0)';
    layers.forEach(el=>{ el.style.transform='translateX(-100%)'; });
    // 전환 완료 → Main Play. transitionend 우선 + 안전 폴백 타이머(hidden 탭 transitionend 지연 대비).
    let done=false;
    function finish(){ if(done) return; done=true; ov.removeEventListener('transitionend', onEnd); show(4); }
    function onEnd(e){ if(e.propertyName==='transform') finish(); }   // show()의 abortTransition이 정리
    ov.addEventListener('transitionend', onEnd);
    transitionTimers.push(setTimeout(finish, 1300));
  }

  // ===== render screen =====
  let cur=0;
  function show(i){
    abortTransition();                 // 진행 중 Journey Start 전환·타이머 정리 (다른 화면 이동 대응)
    cur=i; const s=SCREENS[i];
    [...$('nav').children].forEach((b,bi)=>b.classList.toggle('active',bi===i));
    buildScene(s.scene);
    // banners
    $('bannerL').className='banner'+(s.banner==='loud'?' loud':s.banner==='company'?' company':'');
    $('bannerR').className='banner'+(s.banner==='loud'?' loud':s.banner==='company'?' company':'');
    const adTxt=s.banner==='company'?'♥ 지원회사':(s.banner==='loud'?'AD! AD!':'광고');
    document.querySelectorAll('.ad').forEach(a=>a.textContent=adTxt);
    // title
    $('titleText').style.display=s.title?'block':'none';
    // other
    $('other').style.opacity=s.other?'0.4':'0';
    // gauge
    if(s.gauge){ $('gaugeWrap').style.display='block'; $('gaugeLabel').textContent=s.gauge.label; setTimeout(()=>$('gaugeFill').style.width=(s.gauge.pct*100)+'%',50);}
    else { $('gaugeWrap').style.display='none'; $('gaugeFill').style.width='0'; }
    // postcard
    document.querySelector('.postcard')?.remove();
    if(s.postcard){ const pc=document.createElement('div'); pc.className='postcard';
      for(let k=0;k<30;k++){ const st=document.createElement('div'); st.className='star'; st.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;opacity:.5`; pc.appendChild(st);}
      $('game').insertBefore(pc,$('bubbleLayer')); }
    // bubble position
    $('bubbleLayer').style.top=(s.bubbleTop||280)+'px';
    // sub text (clear)
    let sub=document.getElementById('subText'); if(sub)sub.remove();
    if(s.sub){ sub=document.createElement('div'); sub.id='subText';
      sub.style.cssText='position:absolute;top:340px;left:0;right:0;text-align:center;font-size:14px;color:var(--ink-soft);line-height:1.7;z-index:9;white-space:pre-line;text-shadow:0 1px 3px rgba(0,0,0,.6)';
      sub.textContent=s.sub; $('game').appendChild(sub);}
    // buttons (after typing)
    $('btnRow').style.display='none'; $('btnRow').innerHTML='';
    // typewriter — Journey Start는 문단 순차 타이핑 후 자동 슬라이드 전환(버튼 없음).
    // s.text/s.texts가 없는 autoTransition 화면은 기존 typewriteMessages 분기를 타지 않는다.
    if(s.autoTransition && s.paragraphs){
      typewriteSequence(s.paragraphs, 400, ()=>{
        const t=setTimeout(slideToMainPlay, 600); transitionTimers.push(t);   // 마지막 문단 후 600ms → 슬라이드
      });
    } else {
      typewriteMessages(s.texts||[s.text], ()=>{
        if(s.buttons){ $('btnRow').style.display='flex';
          s.buttons.forEach(([label,variant])=>{ const b=document.createElement('button'); b.className='btn btn-'+variant; b.textContent=label; $('btnRow').appendChild(b);});
        }
      });
    }
    $('screenNote').textContent='● '+s.id+' — '+s.note;
  }

  // nav
  SCREENS.forEach((s,i)=>{ const b=document.createElement('button'); b.textContent=(i+1)+'. '+s.id; b.onclick=()=>show(i); $('nav').appendChild(b);});
  loop(); show(0);
</script>
</body>
</html>
